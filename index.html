<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字命盤｜完整解析</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
:root{
  --ink:#12100a;--bg:#f0ebe0;--gold:#b8923a;--gold-lt:#e8d5a0;--gold-pale:#faf6eb;
  --jade:#2a5e50;--jade-lt:#e4f0ec;--rust:#7d3520;--mist:#6b7280;--border:#d6c99a;--card:#fffdf6;
  --red:#8b2020;--blue:#1a3a5e;--green:#1a5e2a;--yellow:#5e4a10;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
header{background:var(--ink);padding:18px 20px;display:flex;align-items:center;gap:12px;}
.logo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;width:36px;height:36px;padding:4px;border:1.5px solid var(--gold);}
.logo span{background:var(--gold);opacity:.5;}
.logo span:nth-child(5){opacity:1;}
header h1{font-family:'Noto Serif TC',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.1em;}
header p{color:rgba(255,255,255,.4);font-size:.68rem;margin-top:2px;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--jade));}
.card-title{font-family:'Noto Serif TC',serif;font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:.06em;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.field label{display:block;font-size:.72rem;color:var(--mist);margin-bottom:4px;}
.field select,.field input{width:100%;border:1px solid var(--border);background:var(--bg);padding:9px 10px;font-family:'Noto Sans TC',sans-serif;font-size:.88rem;color:var(--ink);border-radius:4px;outline:none;}
.field select:focus,.field input:focus{border-color:var(--gold);}
.btn{width:100%;padding:13px;background:var(--ink);color:var(--gold);border:none;border-radius:4px;font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:700;letter-spacing:.1em;cursor:pointer;margin-top:10px;}
.btn:hover{background:#2d2010;}

/* 四柱 */
.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.pillar{background:var(--card);border:1.5px solid var(--border);border-radius:6px;padding:12px 8px;text-align:center;}
.pillar .p-label{font-size:.7rem;color:var(--mist);margin-bottom:6px;letter-spacing:.06em;}
.pillar .p-gan{font-family:'Noto Serif TC',serif;font-size:1.8rem;font-weight:900;line-height:1;margin-bottom:4px;}
.pillar .p-zhi{font-family:'Noto Serif TC',serif;font-size:1.8rem;font-weight:900;line-height:1;}
.pillar .p-sub{font-size:.68rem;color:var(--mist);margin-top:6px;line-height:1.6;}
.gan-wood{color:#2d6b30;}
.gan-fire{color:#8b2020;}
.gan-earth{color:#7a5a10;}
.gan-metal{color:#4a4a6a;}
.gan-water{color:#1a3a6e;}

/* 五行圖 */
.wx-bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin:12px 0;}
.wx-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.wx-bar{width:100%;border-radius:3px 3px 0 0;transition:height .3s;}
.wx-bar-label{font-size:.72rem;color:var(--mist);}
.wx-bar-val{font-size:.78rem;font-weight:700;}

/* 十神 */
.shen-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0;}
.shen-item{background:var(--gold-pale);border:1px solid var(--gold-lt);border-radius:4px;padding:8px 4px;text-align:center;}
.shen-item .sn{font-family:'Noto Serif TC',serif;font-size:.9rem;font-weight:700;color:var(--gold);}
.shen-item .sl{font-size:.65rem;color:var(--mist);margin-top:2px;}

/* 大運 */
.dayun-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0;}
.dayun-item{flex-shrink:0;width:70px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:8px 4px;text-align:center;}
.dayun-item.current{border-color:var(--gold);background:var(--gold-pale);}
.dayun-item .dy-age{font-size:.65rem;color:var(--mist);margin-bottom:4px;}
.dayun-item .dy-gan{font-family:'Noto Serif TC',serif;font-size:1.1rem;font-weight:700;}
.dayun-item .dy-zhi{font-family:'Noto Serif TC',serif;font-size:1.1rem;font-weight:700;}
.dayun-item .dy-shen{font-size:.62rem;color:var(--gold);margin-top:3px;}

/* 頁面導航 */
.page-nav{display:flex;overflow-x:auto;gap:0;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px;}
.pnav-btn{flex-shrink:0;padding:7px 12px;border:none;background:transparent;border-radius:4px;font-size:.75rem;cursor:pointer;color:var(--mist);font-family:'Noto Sans TC',sans-serif;white-space:nowrap;}
.pnav-btn.on{background:var(--ink);color:var(--gold);font-weight:700;}
.page{display:none;}.page.on{display:block;}

/* 解析區塊 */
.sec{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:12px;}
.sec-head{font-family:'Noto Serif TC',serif;font-size:.9rem;font-weight:700;color:var(--jade);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:22px;height:22px;background:var(--jade);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;}
.sec-body{font-size:.86rem;line-height:1.95;color:#2a200e;}
.sec-body p{margin-bottom:8px;}
.hl{font-weight:700;color:var(--jade);}
.warn{color:var(--rust);font-weight:700;}
.gold{color:var(--gold);font-weight:700;}
.tip{background:var(--gold-pale);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 4px 4px 0;margin-top:10px;font-size:.84rem;line-height:1.8;}

/* 匯出 */
.export-bar{background:var(--ink);border-radius:6px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.export-bar p{color:rgba(255,255,255,.6);font-size:.82rem;}
.ebtn{background:var(--gold);color:var(--ink);border:none;padding:9px 16px;border-radius:4px;font-size:.8rem;font-weight:700;cursor:pointer;}

@media(max-width:480px){
  .row2,.row3,.row4{grid-template-columns:1fr 1fr;}
  .pillar .p-gan,.pillar .p-zhi{font-size:1.5rem;}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div><h1>八字命盤系統</h1><p>四柱 ✦ 五行 ✦ 十神 ✦ 大運 ✦ 流年</p></div>
</header>
<div class="tab-bar" style="background:var(--ink);display:flex;border-top:1px solid rgba(255,255,255,.08);">
  <a onclick="goNav('analyze',this)" class="nav-a on" style="flex:1;text-align:center;padding:10px;color:var(--gold);cursor:pointer;border-bottom:2px solid var(--gold);font-size:.85rem;">📋 命盤解析</a>
  <a onclick="goNav('crm',this)" class="nav-a" style="flex:1;text-align:center;padding:10px;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;font-size:.85rem;">👤 客戶管理</a>
</div>

        <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>
        <option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>

    <div class="field"><label>感情狀態</label>
      <select id="f-status"><option value="單身">單身</option><option value="交往中">交往中</option><option value="已婚">已婚</option><option value="離婚/分手後">離婚/分手後</option></select>
    </div>
    <div class="field"><label>解析年度</label>
      <select id="f-anal-year"></select>
    </div>
  </div>
  <button class="btn" onclick="runBazi()">✦ 起八字命盤</button>
</div>

<div id="result" style="display:none">
  <div class="export-bar">
    <p id="r-title">八字命盤報告</p>
    <div style="display:flex;gap:8px">
      <button class="ebtn" onclick="copyCurrentPage()">📋 複製本頁</button>
      <button class="ebtn" onclick="copyAll()">📋 複製全部</button>
      <button class="ebtn" onclick="window.print()">🖨 列印</button>
    </div>
  </div>
  <div class="page-nav" id="page-nav"></div>
  <div id="pages-container"></div>
</div>

<div id="copy-buf" style="display:none;white-space:pre-wrap"></div>
</div><!-- /analyze-view -->

<div id="crm-view" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div class="card-title" style="margin-bottom:0">客戶管理</div>
      <button onclick="openAddClient()" style="background:var(--jade);color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:.85rem;">＋ 新增客戶</button>

    <div id="client-list"></div>
  </div>
</div>

<div id="client-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:8px;padding:24px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;">
    <h2 id="modal-title" style="font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:700;margin-bottom:16px;">新增客戶</h2>
    <div class="row2">
      <div class="field"><label>姓名</label><input type="text" id="c-name"></div>
      <div class="field"><label>電話</label><input type="text" id="c-phone" placeholder="0912..."></div>

    <div class="row3">

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button onclick="closeModal()" style="padding:9px 20px;border-radius:4px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.85rem;">取消</button>
      <button onclick="saveClient()" style="padding:9px 20px;border-radius:4px;border:none;background:var(--jade);color:#fff;cursor:pointer;font-size:.85rem;font-weight:700;">儲存</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// 萬年曆資料庫（節氣換月基準）
// 每年12個月的節氣日期（該月節氣入節日）
// ══════════════════════════════════════════════════════════
// 格式：JIEQI[year] = [月柱換月日期array，1月到12月]
// 數字代表該月「節」的日期（過了這天才算進入該月柱）
var JIEQI = {
  1940:[6,5,6,5,6,6,7,8,8,8,8,7],1941:[6,4,6,5,6,6,7,8,8,8,7,7],
  1942:[6,4,6,5,6,6,7,8,8,8,7,7],1943:[6,5,6,6,6,6,8,8,8,8,8,7],
  1944:[6,5,6,5,6,6,7,8,8,8,7,7],1945:[6,4,6,5,6,6,7,8,8,8,7,7],
  1946:[6,4,6,5,6,6,7,8,8,8,7,7],1947:[6,5,6,6,6,6,8,8,8,8,8,7],
  1948:[6,5,6,5,6,6,7,8,8,8,7,7],1949:[6,4,6,5,6,6,7,8,8,8,7,7],
  1950:[6,4,6,5,6,6,7,8,8,8,7,7],1951:[6,5,6,6,6,6,8,8,8,8,8,7],
  1952:[6,5,6,5,6,6,7,8,8,8,7,7],1953:[6,4,6,5,6,6,7,8,8,8,7,7],
  1954:[6,4,6,5,6,6,7,8,8,8,7,7],1955:[6,5,6,6,6,6,8,8,8,8,8,7],
  1956:[6,5,6,5,6,6,7,8,8,8,7,7],1957:[6,4,6,5,6,6,7,8,8,8,7,7],
  1958:[6,4,6,5,6,6,7,8,8,8,7,7],1959:[6,5,6,6,6,6,8,8,8,8,8,7],
  1960:[6,5,6,5,6,6,7,8,8,8,7,7],1961:[6,4,6,5,6,6,7,8,8,8,7,7],
  1962:[6,4,6,5,6,6,7,8,8,8,7,7],1963:[6,5,6,6,6,6,8,8,8,8,8,7],
  1964:[6,5,6,5,6,6,7,8,8,8,7,7],1965:[6,4,6,5,6,6,7,8,8,8,7,7],
  1966:[6,4,6,5,6,6,7,8,8,8,7,7],1967:[6,5,6,6,6,6,8,8,8,8,8,7],
  1968:[6,5,6,5,6,6,7,8,8,8,7,7],1969:[6,4,6,5,6,6,7,8,8,8,7,7],
  1970:[6,4,6,5,6,6,7,8,8,8,7,7],1971:[6,5,6,6,6,6,8,8,8,8,8,7],
  1972:[6,5,6,5,6,6,7,8,8,8,7,7],1973:[6,4,6,5,6,6,7,8,8,8,7,7],
  1974:[6,4,6,5,6,6,7,8,8,8,7,7],1975:[6,5,6,6,6,6,8,8,8,8,8,7],
  1976:[6,5,6,5,6,6,7,8,8,8,7,7],1977:[6,4,6,5,6,6,7,8,8,8,7,7],
  1978:[6,4,6,5,6,6,7,8,8,8,7,7],1979:[6,5,6,6,6,6,8,8,8,8,8,7],
  1980:[6,5,6,5,6,6,7,8,8,8,7,7],1981:[6,4,6,5,6,6,7,8,8,8,7,7],
  1982:[6,4,6,5,6,6,7,8,8,8,7,7],1983:[6,5,6,6,6,6,8,8,8,8,8,7],
  1984:[6,5,6,5,6,6,7,8,8,8,7,7],1985:[6,4,6,5,6,6,7,8,8,8,7,7],
  1986:[6,4,6,5,6,6,7,8,8,8,7,7],1987:[6,5,6,6,6,6,8,8,8,8,8,7],
  1988:[6,5,6,5,6,6,7,8,8,8,7,7],1989:[6,4,6,5,6,6,7,8,8,8,7,7],
  1990:[6,4,6,5,6,6,7,8,8,8,7,7],1991:[6,5,6,6,6,6,8,8,8,8,8,7],
  1992:[6,5,6,5,6,6,7,8,8,8,7,7],1993:[6,4,6,5,6,6,7,8,8,8,7,7],
  1994:[6,4,6,5,6,6,7,8,8,8,7,7],1995:[6,5,6,6,6,6,8,8,8,8,8,7],
  1996:[6,5,6,5,6,6,7,8,8,8,7,7],1997:[6,4,6,5,6,6,7,8,8,8,7,7],
  1998:[6,4,6,5,6,6,7,8,8,8,7,7],1999:[6,5,6,6,6,6,8,8,8,8,8,7],
  2000:[6,5,6,5,6,6,7,8,8,8,7,7],2001:[6,4,6,5,6,6,7,8,8,8,7,7],
  2002:[6,4,6,5,6,6,7,8,8,8,7,7],2003:[6,5,6,6,6,6,8,8,8,8,8,7],
  2004:[6,5,6,5,6,6,7,8,8,8,7,7],2005:[6,4,6,5,6,6,7,8,8,8,7,7],
  2006:[6,4,6,5,6,6,7,8,8,8,7,7],2007:[6,5,6,6,6,6,8,8,8,8,8,7],
  2008:[6,5,6,5,6,6,7,8,8,8,7,7],2009:[6,4,6,5,6,6,7,8,8,8,7,7],
  2010:[6,4,6,5,6,6,7,8,8,8,7,7]
};

// 日柱基準：以 1900/1/1 為甲子日(index=0)計算
// 日干支循環60
var DAY_BASE = new Date(1900,0,1);

// ══════════════════════════════════════════════════════════
// 天干地支常數
// ══════════════════════════════════════════════════════════
var GAN  = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var ZHI  = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var ANIMAL = ['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
// 天干五行
var GAN_WX  = ['木','木','火','火','土','土','金','金','水','水'];
// 天干陰陽
var GAN_YY  = ['陽','陰','陽','陰','陽','陰','陽','陰','陽','陰'];
// 地支五行
var ZHI_WX  = ['水','土','木','木','土','火','火','土','金','金','土','水'];
// 地支藏干（主氣）
var ZHI_CANG = [
  ['壬','癸'],['己','癸','辛'],['甲','丙','戊'],['甲','乙'],
  ['戊','乙','癸'],['丙','庚','戊'],['丙','丁','己'],['己','乙','丁'],
  ['庚','壬','戊'],['庚','辛'],['戊','辛','丁'],['壬','甲']
];
// 五行顏色 class
var WX_COLOR = {木:'gan-wood',火:'gan-fire',土:'gan-earth',金:'gan-metal',水:'gan-water'};
// 五行代表色（圖表用）
var WX_CHART_COLOR = {木:'#2d6b30',火:'#c0392b',土:'#c9a84c',金:'#7f8c8d',水:'#2980b9'};

// ══════════════════════════════════════════════════════════
// 四柱排盤
// ══════════════════════════════════════════════════════════
function getYearPillar(y, m, d) {
  // 立春前算上一年
  var jieqiM1 = JIEQI[y] ? JIEQI[y][0] : 6;
  var isBeforeLichun = (m === 1) || (m === 2 && d < jieqiM1);
  var baziYear = isBeforeLichun ? y - 1 : y;
  var ganIdx = (baziYear - 4) % 10;
  if(ganIdx < 0) ganIdx += 10;
  var zhiIdx = (baziYear - 4) % 12;
  if(zhiIdx < 0) zhiIdx += 12;
  return {gan: GAN[ganIdx], zhi: ZHI[zhiIdx], ganIdx: ganIdx, zhiIdx: zhiIdx, year: baziYear};
}

function getMonthPillar(y, m, d) {
  // 根據節氣判斷月柱
  var jq = JIEQI[y] || JIEQI[2000];
  var baziMonth;
  if(d >= jq[m-1]) {
    baziMonth = m; // 已過節，用本月
  } else {
    baziMonth = m - 1; // 未過節，用上月
    if(baziMonth === 0) baziMonth = 12;
  }
  // 月干：根據年干推月干（五虎遁年起月法）
  var yp = getYearPillar(y, m, d);
  var yGanIdx = yp.ganIdx;
  // 寅月(3)為正月，月支從寅開始
  // 月支index：寅=2，所以月支 = (baziMonth + 1) % 12
  var mZhiIdx = (baziMonth + 1) % 12;
  // 年干與月干關係（五虎遁）
  // 甲己年：寅月起丙寅
  var mGanStart = {0:2, 1:4, 2:6, 3:8, 4:0, 5:2, 6:4, 7:6, 8:8, 9:0}[yGanIdx % 5 === 0 ? 0 : yGanIdx % 5 === 1 ? 1 : yGanIdx % 5 === 2 ? 2 : yGanIdx % 5 === 3 ? 3 : 4];
  // 更精確：甲己→丙，乙庚→戊，丙辛→庚，丁壬→壬，戊癸→甲
  var startGan = [2,4,6,8,0][(yGanIdx%5)];
  // 從寅月開始算，寅=index 2
  // baziMonth=1→寅月(index2)，baziMonth=2→卯月...
  var monthOffset = baziMonth - 1; // 0-based，0=寅
  var mGanIdx = (startGan + monthOffset) % 10;
  return {gan: GAN[mGanIdx], zhi: ZHI[mZhiIdx], ganIdx: mGanIdx, zhiIdx: mZhiIdx, month: baziMonth};
}

function getDayPillar(y, m, d) {
  var date = new Date(y, m-1, d);
  // 1900/1/1 為甲戌日（甲=index0，戌=index10），校正偏移量+10，經多組獨立查證日期驗證無誤
  var diff = Math.round((date - DAY_BASE) / 86400000) + 10;
  var ganIdx = ((diff % 10) + 10) % 10;
  var zhiIdx = ((diff % 12) + 12) % 12;
  return {gan: GAN[ganIdx], zhi: ZHI[zhiIdx], ganIdx: ganIdx, zhiIdx: zhiIdx};
}

function getHourPillar(hourIdx, dayGanIdx) {
  if(hourIdx < 0) return null;
  // 日上起時法
  var startGan = [0,2,4,6,8][(dayGanIdx%5)];
  var hGanIdx = (startGan + hourIdx) % 10;
  return {gan: GAN[hGanIdx], zhi: ZHI[hourIdx], ganIdx: hGanIdx, zhiIdx: hourIdx};
}

// ══════════════════════════════════════════════════════════
// 五行計算
// ══════════════════════════════════════════════════════════
function calcWuxing(pillars) {
  var wx = {木:0, 火:0, 土:0, 金:0, 水:0};
  pillars.forEach(function(p) {
    if(!p) return;
    wx[GAN_WX[p.ganIdx]] += 2; // 天干計2分
    wx[ZHI_WX[p.zhiIdx]] += 1; // 地支主氣計1分
    // 藏干
    ZHI_CANG[p.zhiIdx].forEach(function(g, i) {
      var idx = GAN.indexOf(g);
      if(idx >= 0) wx[GAN_WX[idx]] += (i===0 ? 1.5 : 0.5);
    });
  });
  return wx;
}

// ══════════════════════════════════════════════════════════
// 十神
// ══════════════════════════════════════════════════════════
var SHISHEN_TABLE = [
  // 日主為 甲乙丙丁戊己庚辛壬癸，其他干對應十神
  // index: [日主ganIdx][目標ganIdx] = 十神
];
function getTenGod(dayGanIdx, targetGanIdx) {
  var dayWx = GAN_WX[dayGanIdx];
  var dayYY = GAN_YY[dayGanIdx];
  var tgtWx = GAN_WX[targetGanIdx];
  var tgtYY = GAN_YY[targetGanIdx];
  // 五行相生相剋關係
  var sheng = {木:'火',火:'土',土:'金',金:'水',水:'木'};
  var ke = {木:'土',火:'金',土:'水',金:'木',水:'火'};
  var beSheng = {火:'木',土:'火',金:'土',水:'金',木:'水'};
  var beKe = {土:'木',金:'火',水:'土',木:'金',火:'水'};

  if(tgtWx === dayWx) {
    return tgtYY === dayYY ? '比肩' : '劫財';
  } else if(sheng[dayWx] === tgtWx) {
    return tgtYY === dayYY ? '食神' : '傷官';
  } else if(ke[dayWx] === tgtWx) {
    return tgtYY === dayYY ? '偏財' : '正財';
  } else if(beKe[dayWx] === tgtWx) {
    return tgtYY === dayYY ? '偏官(七殺)' : '正官';
  } else if(beSheng[dayWx] === tgtWx) {
    return tgtYY === dayYY ? '偏印' : '正印';
  }
  return '—';
}

// ══════════════════════════════════════════════════════════
// 大運計算
// ══════════════════════════════════════════════════════════
function getDayun(gender, yearGanIdx, birthY, birthM, birthD, analYear) {
  // 陽年男命/陰年女命 → 順行；否則逆行
  var yangYear = (yearGanIdx % 2 === 0);
  var isMale = (gender === 'male');
  var shunxing = (yangYear && isMale) || (!yangYear && !isMale);

  var jq = JIEQI[birthY] || JIEQI[2000];
  var birthDate = new Date(birthY, birthM-1, birthD);
  var daysToJieqi;

  if(shunxing) {
    // 順行：找出生後的下一個節氣
    var nm = birthM, nYear = birthY;
    var nd = jq[nm-1];
    if(birthD >= nd) {
      nm++;
      if(nm > 12) { nm = 1; nYear = birthY + 1; }
    }
    var nJq = JIEQI[nYear] || jq;
    nd = nJq[nm-1];
    var nextJieqiDate = new Date(nYear, nm-1, nd);
    daysToJieqi = Math.round((nextJieqiDate - birthDate) / 86400000);
  } else {
    // 逆行：找出生前的上一個節氣
    var pm = birthM, pYear = birthY;
    var pd = jq[pm-1];
    if(birthD < pd) {
      pm--;
      if(pm < 1) { pm = 12; pYear = birthY - 1; }
    }
    var pJq = JIEQI[pYear] || jq;
    pd = pJq[pm-1];
    var prevJieqiDate = new Date(pYear, pm-1, pd);
    daysToJieqi = Math.round((birthDate - prevJieqiDate) / 86400000);
  }

  // 防呆：天數差異常時強制歸零
  if(!(daysToJieqi >= 0 && daysToJieqi < 40)) daysToJieqi = Math.abs(daysToJieqi) % 30;

  // 3天=1年大運
  var startAge = Math.max(0, Math.min(10, Math.round(daysToJieqi / 3)));
  var startYear = birthY + startAge;

  // 起大運干支：從月柱開始順/逆推
  var mp = getMonthPillar(birthY, birthM, birthD);
  var dayuns = [];
  for(var i=0; i<8; i++) {
    var offset = shunxing ? (i+1) : -(i+1);
    var gIdx = ((mp.ganIdx + offset) % 10 + 10) % 10;
    var zIdx = ((mp.zhiIdx + offset) % 12 + 12) % 12;
    var age = startAge + i*10;
    var yr = startYear + i*10;
    var isCurrent = (analYear >= yr && analYear < yr+10);
    dayuns.push({
      gan: GAN[gIdx], zhi: ZHI[zIdx],
      ganIdx: gIdx, zhiIdx: zIdx,
      age: age, year: yr, isCurrent: isCurrent
    });
  }
  // 只保留合理年齡（85歲以內）的大運
  dayuns = dayuns.filter(function(d){ return d.age <= 85; });
  return {dayuns: dayuns, startAge: startAge, shunxing: shunxing};
}

var BZ = null;

// ══════════════════════════════════════════════════════════
// 主函式
// ══════════════════════════════════════════════════════════
function runBazi() {
  var name = document.getElementById('f-name').value.trim() || '命主';
  var gender = document.getElementById('f-gender').value;
  var y = parseInt(document.getElementById('f-year').value);
  var m = parseInt(document.getElementById('f-month').value);
  var d = parseInt(document.getElementById('f-day').value);
  var hourIdx = parseInt(document.getElementById('f-hour').value);
  var status = document.getElementById('f-status').value;
  var analYear = parseInt(document.getElementById('f-anal-year').value);

  if(!y||!m||!d) { alert('請選擇完整的出生年月日'); return; }

  var yp = getYearPillar(y, m, d);
  var mp = getMonthPillar(y, m, d);
  var dp = getDayPillar(y, m, d);
  var hp = getHourPillar(hourIdx, dp.ganIdx);

  var pillars = [yp, mp, dp, hp];
  var wx = calcWuxing(pillars.filter(function(p){return p;}));

  // 日主
  var dayGan = dp.gan;
  var dayGanIdx = dp.ganIdx;
  var dayWx = GAN_WX[dayGanIdx];

  // 大運
  var dyInfo = getDayun(gender, yp.ganIdx, y, m, d, analYear);
  var currentDayun = dyInfo.dayuns.find(function(d){return d.isCurrent;}) || dyInfo.dayuns[0];

  // 流年干支
  var lyGanIdx = (analYear - 4) % 10; if(lyGanIdx<0) lyGanIdx+=10;
  var lyZhiIdx = (analYear - 4) % 12; if(lyZhiIdx<0) lyZhiIdx+=12;
  var liuNian = {gan:GAN[lyGanIdx],zhi:ZHI[lyZhiIdx],ganIdx:lyGanIdx,zhiIdx:lyZhiIdx};

  // 日主強弱（簡化：計算生身之力）
  var supportWx = {木:['木','水'],火:['火','木'],土:['土','火'],金:['金','土'],水:['水','金']};
  var support = supportWx[dayWx];
  var strength = 0;
  pillars.filter(function(p){return p;}).forEach(function(p){
    if(support.indexOf(GAN_WX[p.ganIdx])>=0) strength++;
    if(support.indexOf(ZHI_WX[p.zhiIdx])>=0) strength++;
  });
  var isStrong = strength >= 4;

  BZ = {
    name:name, gender:gender, y:y, m:m, d:d, hourIdx:hourIdx,
    status:status, analYear:analYear,
    yp:yp, mp:mp, dp:dp, hp:hp,
    wx:wx, dayGan:dayGan, dayGanIdx:dayGanIdx, dayWx:dayWx,
    dayuns:dyInfo.dayuns, startAge:dyInfo.startAge, shunxing:dyInfo.shunxing,
    currentDayun:currentDayun, liuNian:liuNian,
    isStrong:isStrong, strength:strength
  };

  document.getElementById('r-title').textContent = name + '｜' + y + '/' + m + '/' + d + ' 八字命盤';
  buildPages();
  document.getElementById('result').style.display = '';
  document.getElementById('input-card').style.display = 'none';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

      '食神':{child:'這段時期生活相對順遂快樂，才藝或興趣開始展現天分，是無憂無慮的成長階段。',adult:'這段時期生活順遂，才藝有發揮的舞台，工作和感情都相對和諧，是值得好好享受和累積的階段。'},
      '傷官':{child:'這段時期個性直率敢言，可能因為表達方式直接而與師長家人有些摩擦，其實只是還在學習如何表達自己。',adult:'這段時期才華容易展現但也容易得罪人，需要留意言行分寸，感情或合作關係可能有波折，宜謹言慎行。'},
      '偏財':{child:'這段時期家庭經濟或生活環境可能有變動，物質資源較活絡，人際接觸面廣。',adult:'這段時期偏財機會多，人脈帶來財源，社交活躍，但花費也大，需要建立理財紀律，避免財來財去留不住。'},
      '正財':{child:'這段時期家庭生活較穩定，物質不虞匱乏，開始建立對金錢的初步概念。',adult:'這段時期收入趨於穩定，適合腳踏實地累積財富、建立長期的財務基礎，是適合置產或投資自己的階段。'},

      '正官':{child:'這段時期生活作息較規律，個性中重規矩守序的一面開始養成，容易在團體中獲得肯定。',adult:'這段時期適合在體制內穩健發展，工作上容易獲得認可或升遷機會，生活步調規律，重視責任與承諾。'},
      '偏印':{child:'這段時期對特殊事物容易產生興趣，想像力豐富，學習上時而專注時而分心，是探索自我的階段。',adult:'這段時期容易對特定領域產生濃厚興趣並深入鑽研，但也可能顯得孤僻或懶散，建議找到明確方向後全心投入。'},
      '正印':{child:'這段時期受到長輩較多照顧與關愛，成長環境相對穩定，學習運勢也不錯。',adult:'這段時期學習運旺，容易得到貴人或長輩的資源挹注，適合進修充電，為下一階段的發展做準備。'}
    };
    B.dayuns.slice(0,7).forEach(function(dy){
      var sg=getTenGod(B.dayGanIdx,dy.ganIdx);

      html+='<p>'+(dy.isCurrent?'<span class="gold">▶ 現在：</span>':'')+'<span class="'+(goodYun?'hl':'warn')+'">'+dy.age+'～'+(dy.age+10)+'歲（'+dy.gan+dy.zhi+'，'+sg+'）</span>：'+desc+'</p>';

    html+='<div class="tip">'+lessonMap2[B.dayWx]+'</div>';

  // ── P24：綜合建議 ──
  if(id==='p24') {
    var wxOrder5=['木','火','土','金','水'];

    html+='<p>命盤最旺五行：<span class="hl">'+maxWx5+'</span>，這是你天生最強的能量，事業和人際都應圍繞這個核心建立。</p>';

    var suggestions=[
      (B.isStrong?'把能量集中在最重要的一件事，你的爆發力需要聚焦才能最大化。':'找到能讓你發揮的環境和支持系統，今年不適合獨自單打獨鬥。'),
      (['正財','偏財','食神'].indexOf(lyTenGod3)>=0?'今年財運有機會，主動出擊，不要等機會上門。':'今年財務宜穩健，不宜大額投資，先整理現有資源。'),
      (B.status==='單身'?'感情方面，今年'+(['正財','偏財','正官','偏官(七殺)'].indexOf(lyTenGod3)>=0?'有動靜，多出門社交，機會在生活中。':'感情平穩，先充實自己，緣分自然來。'):'感情方面，用心維護現有感情，'+(['偏官(七殺)','傷官'].indexOf(lyTenGod3)>=0?'容易有摩擦，耐心溝通比爭輸贏重要。':'感情平穩，適合製造共同回憶。'))
    ];
    suggestions.forEach(function(s,i){html+='<p>'+['①','②','③'][i]+' '+s+'</p>';});
    html+='<div class="tip">你的命盤最大的禮物是「'+(B.isStrong?B.dayWx+'氣旺，行動力和意志力超強，一旦找對方向很少有人擋得住。':B.dayWx+'氣雖弱，但這讓你更細膩、更懂得借力，往往能在關鍵時刻得到貴人幫助。')+'」好好珍惜和發揮這份天賦。</div>';
    html+='</div></div>';

  return html;
}

// 合婚計算
// ══════════════════════════════════════════════════════════
function calcHeHun() {
  var py = parseInt(document.getElementById('partner-year').value);
  var pm = parseInt(document.getElementById('partner-month').value)||6;
  var pd = parseInt(document.getElementById('partner-day').value)||15;
  var el = document.getElementById('hehun-result');
  if(!py||py<1900||py>2010){el.innerHTML='<p style="color:var(--rust)">請輸入正確的出生年份（1900-2010）</p>';return;}

  var pYp = getYearPillar(py,pm,pd);
  var pDp = getDayPillar(py,pm,pd);
  var pWx = calcWuxing([pYp, getMonthPillar(py,pm,pd), pDp]);
  var pDayWx = GAN_WX[pDp.ganIdx];

  // 雙方日主五行關係
  var myWx = BZ.dayWx;
  var sheng = {木:'火',火:'土',土:'金',金:'水',水:'木'};
  var ke = {木:'土',火:'金',土:'水',金:'木',水:'火'};

  var rel='';
  var score=0;
  if(sheng[myWx]===pDayWx){rel='你的五行（'+myWx+'）生對方（'+pDayWx+'）';score=90;}
  else if(sheng[pDayWx]===myWx){rel='對方五行（'+pDayWx+'）生你（'+myWx+'）';score=85;}
  else if(myWx===pDayWx){rel='雙方五行相同（'+myWx+'+'+pDayWx+'）';score=75;}
  else if(ke[myWx]===pDayWx){rel='你的五行（'+myWx+'）剋對方（'+pDayWx+'），你主導型';score=65;}
  else if(ke[pDayWx]===myWx){rel='對方五行（'+pDayWx+'）剋你（'+myWx+'），對方主導型';score=60;}

  // 年支合沖
  var myZhi = BZ.yp.zhiIdx;
  var pZhi = pYp.zhiIdx;
  var zhiHe = [[0,7],[1,8],[2,9],[3,10],[4,11],[5,6]]; // 子丑合、寅亥合等六合
  var zhiChong = Math.abs(myZhi-pZhi)===6; // 六沖
  var isHe = zhiHe.some(function(pair){return (pair[0]===myZhi&&pair[1]===pZhi)||(pair[1]===myZhi&&pair[0]===pZhi);});

  var color = score>=85?'var(--jade)':score>=70?'var(--gold)':'var(--rust)';
  var grade = score>=85?'相當合適 ✦':score>=70?'基本合適':'需要磨合';

  var html='<div style="background:var(--card);border:1.5px solid var(--border);border-radius:6px;padding:16px;margin-top:10px;">';
  html+='<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">';
  html+='<div style="text-align:center"><div style="font-size:.7rem;color:var(--mist)">命主</div><div style="font-family:\'Noto Serif TC\',serif;font-size:1.4rem;font-weight:900;color:var(--gold)">'+BZ.dayGan+'</div><div style="font-size:.75rem;color:var(--mist)">'+myWx+'</div></div>';
  html+='<div style="font-size:1.2rem;color:var(--mist)">×</div>';
  html+='<div style="text-align:center"><div style="font-size:.7rem;color:var(--mist)">對方</div><div style="font-family:\'Noto Serif TC\',serif;font-size:1.4rem;font-weight:900;color:var(--jade)">'+pDp.gan+'</div><div style="font-size:.75rem;color:var(--mist)">'+pDayWx+'</div></div>';
  html+='<div style="flex:1;text-align:right"><div style="font-size:2rem;font-weight:900;font-family:\'Noto Serif TC\',serif;color:'+color+'">'+score+'分</div><div style="font-size:.82rem;color:'+color+'">'+grade+'</div></div>';
  html+='</div>';
  html+='<p><span class="hl">五行關係：</span>'+rel+'</p>';

  var relDesc={
    90:'你的能量滋養對方，對方在你身邊會越來越好，你也會有成就感。這是最好的組合之一。',
    85:'對方的能量滋養你，你在這段感情中會被照顧和支持，容易依賴對方，要保持自己的獨立性。',
    75:'雙方個性相似，容易理解對方，但也容易在某些事上競爭或固執，需要彼此讓步。',
    65:'你的個性容易主導這段關係，對方可能感到壓力，要注意給對方足夠的空間和尊重。',
    60:'對方個性容易主導，你可能有時感到壓力，重要的是找到舒適的相處節奏。'
  };
  html+='<p>'+(relDesc[score]||'')+'</p>';

  if(isHe) html+='<p><span class="hl">年支六合：</span>'+ZHI[myZhi]+'與'+ZHI[pZhi]+'相合，代表雙方有天然的親和力和默契，相處起來自然舒服。</p>';
  if(zhiChong) html+='<p><span class="warn">年支六沖：</span>'+ZHI[myZhi]+'與'+ZHI[pZhi]+'相沖，雙方在某些根本觀念上可能有差異，需要更多包容和溝通。</p>';

  html+='<p style="font-size:.75rem;color:var(--mist);margin-top:8px">※ 完整合婚需要雙方完整八字（含時辰）深入推算，此為簡化參考。感情最重要的還是雙方的心意和努力。</p>';
  html+='</div>';
  el.innerHTML=html;
}

// 複製功能
// ══════════════════════════════════════════════════════════
function copyText(t){if(!t||!t.trim()){alert('請先起盤');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('已複製！');}).catch(function(){fbCopy(t);});}else{fbCopy(t);}}function fbCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');alert('已複製！');}catch(e){alert('請手動複製');}document.body.removeChild(ta);}function copyCurrentPage(){var p=document.querySelector('.page.on');if(!p){alert('請先起盤');return;}var h=p.querySelector('.sec-head');var b=p.querySelector('.sec-body')||p;var ti=h?h.textContent.trim():'';var bo=(b.innerText||b.textContent).trim();copyText(ti+'\n\n'+bo);}function copyAll(){if(!BZ){alert('請先起盤');return;}var arr=['八字命盤報告',BZ.name+'｜'+BZ.y+'/'+BZ.m+'/'+BZ.d,'日主：'+BZ.dayGan+'（'+BZ.dayWx+'）'+(BZ.isStrong?'偏強':'偏弱'),''];document.querySelectorAll('.page').forEach(function(p){var h=p.querySelector('.sec-head');var b=p.querySelector('.sec-body')||p;if(h&&b){arr.push(h.textContent.trim());arr.push((b.innerText||b.textContent).trim());arr.push('');}});copyText(arr.join('\n'));}

// 導覽切換

function goNav(view, el){
  document.querySelectorAll('.nav-a').forEach(function(a){
    a.classList.remove('on');
    a.style.color='rgba(255,255,255,.5)';
    a.style.borderBottomColor='transparent';
  });
  el.classList.add('on');
  el.style.color='var(--gold)';
  el.style.borderBottomColor='var(--gold)';
  document.getElementById('analyze-view').style.display = view==='analyze' ? '' : 'none';
  document.getElementById('crm-view').style.display = view==='crm' ? '' : 'none';
  if(view==='crm') renderClients();
}

// CRM（與靈數命盤系統共用同一份 localStorage 客戶資料）
// ══════════════════════════════════════════════════════════
var clients=JSON.parse(localStorage.getItem('mp_clients')||'[]');
var editIdx=-1;

function renderClients(){
  var el=document.getElementById('client-list');
  if(!clients.length){
    el.innerHTML='<div style="text-align:center;padding:40px;color:var(--mist);font-size:.88rem;">尚未新增任何客戶</div>';
    return;
  }
  el.innerHTML='';
  clients.forEach(function(c,i){
    var info='';
    if(c.year&&c.month&&c.day){
      try{
        var dp=getDayPillar(+c.year,+c.month,+c.day);
        info='日主'+dp.gan+'（'+GAN_WX[dp.ganIdx]+'）';
      }catch(e){}
    }
    var div=document.createElement('div');
    div.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;';
    div.innerHTML='<div><h3 style="font-size:.92rem;font-weight:700;margin-bottom:4px;">'+c.name+'</h3>'+
      '<p style="font-size:.78rem;color:var(--mist);line-height:1.6;">'+(c.phone||'')+(info?' ｜ '+info:'')+(c.note?' ｜ '+c.note:'')+'</p></div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0;">'+
      '<button onclick="loadClient('+i+')" style="padding:6px 12px;border:1px solid var(--jade);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--jade);color:#fff;">起盤</button>'+
      '<button onclick="editClient('+i+')" style="padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--bg);">編輯</button>'+
      '<button onclick="delClient('+i+')" style="padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--bg);">刪除</button>'+
      '</div>';
    el.appendChild(div);
  });
}

function openAddClient(){
  editIdx=-1;
  document.getElementById('modal-title').textContent='新增客戶';
  ['c-name','c-phone','c-year','c-month','c-day','c-note'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('client-modal').style.display='flex';
}
function editClient(i){
  editIdx=i;
  var c=clients[i];
  document.getElementById('modal-title').textContent='編輯客戶';
  document.getElementById('c-name').value=c.name||'';
  document.getElementById('c-phone').value=c.phone||'';
  document.getElementById('c-year').value=c.year||'';
  document.getElementById('c-month').value=c.month||'';
  document.getElementById('c-day').value=c.day||'';
  document.getElementById('c-note').value=c.note||'';
  document.getElementById('client-modal').style.display='flex';
}
function closeModal(){ document.getElementById('client-modal').style.display='none'; }
function saveClient(){
  var c={
    name:document.getElementById('c-name').value.trim(),
    phone:document.getElementById('c-phone').value.trim(),
    year:document.getElementById('c-year').value.trim(),
    month:document.getElementById('c-month').value.trim(),
    day:document.getElementById('c-day').value.trim(),
    note:document.getElementById('c-note').value.trim()
  };
  if(!c.name){alert('請輸入姓名');return;}
  if(editIdx>=0){
    c=Object.assign({},clients[editIdx],c);
    clients[editIdx]=c;
  } else {
    clients.push(c);
  }
  localStorage.setItem('mp_clients',JSON.stringify(clients));
  closeModal();
  renderClients();
}
function delClient(i){
  if(!confirm('確定刪除「'+clients[i].name+'」？')) return;
  clients.splice(i,1);
  localStorage.setItem('mp_clients',JSON.stringify(clients));
  renderClients();
}
function loadClient(i){
  var c=clients[i];
  document.getElementById('f-name').value=c.name||'';
  if(c.year) document.getElementById('f-year').value=c.year;
  if(c.month) document.getElementById('f-month').value=c.month;
  if(c.day) document.getElementById('f-day').value=c.day;
  if(c.gender) document.getElementById('f-gender').value=c.gender;
  if(c.status) document.getElementById('f-status').value=c.status;
  goNav('analyze', document.querySelectorAll('.nav-a')[0]);
  window.scrollTo(0,0);
}
